[group:talebook]
programs=gateway,nginx,bootstrap,tornado

[program:gateway]
command=python3 /var/www/talebook/docker/vercel/gateway.py
priority=10
autostart=true
autorestart=unexpected
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;'
priority=20
autostart=true
autorestart=unexpected

[program:bootstrap]
command=/var/www/talebook/docker/vercel/bootstrap.sh
priority=30
directory=/var/www/talebook
autostart=true
autorestart=false
startsecs=0
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:tornado]
command=python3 server.py --with-library=/data/books/library --port=8000 --host=127.0.0.1 --logging=debug --log-file-prefix=/data/log/talebook.log
priority=40
directory=/var/www/talebook
autostart=false
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
