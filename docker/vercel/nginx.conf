# Vercel container functions mount the image read-only and provide /tmp as the
# writable scratch space. Keep every Nginx runtime path below that directory.
user root;
worker_processes 1;
pid /tmp/talebook/run/nginx.pid;
error_log /tmp/talebook/log/nginx/error.log warn;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
}

http {
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /tmp/talebook/log/nginx/access.log;
    gzip on;

    client_body_temp_path /tmp/talebook/nginx/client_body;
    proxy_temp_path /tmp/talebook/nginx/proxy;
    fastcgi_temp_path /tmp/talebook/nginx/fastcgi;
    uwsgi_temp_path /tmp/talebook/nginx/uwsgi;
    scgi_temp_path /tmp/talebook/nginx/scgi;

    include /etc/nginx/conf.d/*.conf;
}
